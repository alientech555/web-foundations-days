<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Editor</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>QuickNotes Editor</h1>
    </header>
    <main>
      <section>
        <label for="note-text">Write your note:</label>
        <textarea id="note-text" placeholder="Start typing..."></textarea>
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
        <button id="clear-btn">Clear</button>
        <button id="theme-toggle">Dark mode</button>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
